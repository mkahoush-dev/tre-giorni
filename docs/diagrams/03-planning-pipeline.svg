<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="t d"><title id="t">3 · From preferences to an itinerary</title><desc id="d">routeOptions computes required hubs, candidate routes and scores; plan computes dates, assigns must-sees to days, builds each day and collects conflicts.</desc><defs><marker id="a-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0d1b2a"/></marker><marker id="a-go" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2e7d5b"/></marker><marker id="a-stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c8102e"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5b6878"/></marker><marker id="a-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b8860b"/></marker></defs><rect width="1280" height="760" fill="#ffffff"/><text x="32" y="44" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="22" fill="#0d1b2a" font-weight="700" text-anchor="start">3 · From preferences to an itinerary</text><text x="32" y="68" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="13.5" fill="#5b6878" font-weight="400" text-anchor="start">Two public calls: routeOptions(input) offers 3 city routes; plan(input, route) builds the 3 days. Same input → same output.</text><rect x="32" y="100" width="250" height="190" rx="8" fill="#ffffff" stroke="#c9d1da" stroke-width="1.5"/><text x="44" y="124" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="14" fill="#0d1b2a" font-weight="700" text-anchor="start">TripInput</text><text x="44" y="142" font-family="&#x27;JetBrains Mono&#x27;, &#x27;SF Mono&#x27;, Menlo, monospace" font-size="11.5" fill="#5b6878" font-weight="400" text-anchor="start">planner/types.ts</text><text x="44" y="160" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">startDate</text><text x="44" y="178" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">interests[]</text><text x="44" y="196" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">priorities[] (ordered)</text><text x="44" y="214" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">pace, maxPrice</text><text x="44" y="232" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">mustSee[] ids</text><text x="44" y="250" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">locked[], exclude[]</text><text x="44" y="268" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">cities[] (route mode)</text><rect x="310" y="92" width="450" height="300" rx="12" fill="none" stroke="#5b6878" stroke-width="1.2" stroke-dasharray="5 5"/><text x="324" y="114" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#5b6878" font-weight="700" text-anchor="start">ROUTEOPTIONS()  ·  PLAN.TS:111</text><rect x="330" y="128" width="200" height="100" rx="8" fill="#ffffff" stroke="#c9d1da" stroke-width="1.5"/><text x="342" y="152" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="14" fill="#0d1b2a" font-weight="700" text-anchor="start">requiredHubs</text><text x="342" y="170" font-family="&#x27;JetBrains Mono&#x27;, &#x27;SF Mono&#x27;, Menlo, monospace" font-size="11.5" fill="#5b6878" font-weight="400" text-anchor="start">plan.ts:15</text><text x="342" y="188" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">must-see cities</text><text x="342" y="206" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">(day trips → hub)</text><rect x="546" y="128" width="196" height="100" rx="8" fill="#ffffff" stroke="#c9d1da" stroke-width="1.5"/><text x="558" y="152" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="14" fill="#0d1b2a" font-weight="700" text-anchor="start">candidateRoutes</text><text x="558" y="170" font-family="&#x27;JetBrains Mono&#x27;, &#x27;SF Mono&#x27;, Menlo, monospace" font-size="11.5" fill="#5b6878" font-weight="400" text-anchor="start">plan.ts:20</text><text x="558" y="188" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">1 city ×3, or pairs</text><text x="558" y="206" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">≤150 min train;</text><text x="558" y="224" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">3 cities only if forced</text><rect x="330" y="252" width="412" height="120" rx="8" fill="#ffffff" stroke="#c9d1da" stroke-width="1.5"/><text x="342" y="276" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="14" fill="#0d1b2a" font-weight="700" text-anchor="start">scoreRoute (per candidate)</text><text x="342" y="294" font-family="&#x27;JetBrains Mono&#x27;, &#x27;SF Mono&#x27;, Menlo, monospace" font-size="11.5" fill="#5b6878" font-weight="400" text-anchor="start">plan.ts:63</text><text x="342" y="312" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">sum of best place scores each day, only places</text><text x="342" y="330" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">open on that date · travel day counts 60%</text><text x="342" y="348" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">− train hours × 0.3 · −100 per must-see it can&#x27;t host</text><text x="342" y="366" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">→ top 3, highlights = picks not shared by all</text><path d="M 282 178 L 330 178" fill="none" stroke="#0d1b2a" stroke-width="1.6" marker-end="url(#a-navy)"/><path d="M 530 178 L 546 178" fill="none" stroke="#0d1b2a" stroke-width="1.6" marker-end="url(#a-navy)"/><path d="M 644 228 L 644 252" fill="none" stroke="#0d1b2a" stroke-width="1.6" marker-end="url(#a-navy)"/><rect x="790" y="128" width="210" height="110" rx="8" fill="#fff6d6" stroke="#b8860b" stroke-width="1.5"/><text x="802" y="152" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="14" fill="#8a6400" font-weight="700" text-anchor="start">Route ×3</text><text x="802" y="170" font-family="Inter, &#x27;Segoe UI&#x27;, system-u