<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="t d"><title id="t">4 · buildDay: the greedy day builder</title><desc id="d">Flowchart of buildDay: start of day, per-slot deadline, bestCandidate with pinned-first, candidate pool, evaluation of time feasibility, scoring, placing, and the after-template steps.</desc><defs><marker id="a-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0d1b2a"/></marker><marker id="a-go" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2e7d5b"/></marker><marker id="a-stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c8102e"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5b6878"/></marker><marker id="a-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b8860b"/></marker></defs><rect width="1280" height="900" fill="#ffffff"/><text x="32" y="44" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="22" fill="#0d1b2a" font-weight="700" text-anchor="start">4 · buildDay: the greedy day builder</text><text x="32" y="68" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="13.5" fill="#5b6878" font-weight="400" text-anchor="start">schedule.ts:77 — walks the pace template slot by slot; each slot takes a pinned place if one fits, else the best-scoring feasible place.</text><rect x="32" y="100" width="300" height="150" rx="8" fill="#ffffff" stroke="#c9d1da" stroke-width="1.5"/><text x="44" y="124" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="14" fill="#0d1b2a" font-weight="700" text-anchor="start">Start of day</text><text x="44" y="142" font-family="&#x27;JetBrains Mono&#x27;, &#x27;SF Mono&#x27;, Menlo, monospace" font-size="11.5" fill="#5b6878" font-weight="400" text-anchor="start">schedule.ts:77-108</text><text x="44" y="160" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">cursor = 09:00, position = city centre</text><text x="44" y="178" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">arriving by train? add train row,</text><text x="44" y="196" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">cursor += train + 15 min</text><text x="44" y="214" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">pinned day-trip town? add train</text><text x="44" y="232" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">out, switch context to the town</text><rect x="32" y="280" width="300" height="150" rx="8" fill="#ffffff" stroke="#c9d1da" stroke-width="1.5"/><text x="44" y="304" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="14" fill="#0d1b2a" font-weight="700" text-anchor="start">Pace template</text><text x="44" y="322" font-family="&#x27;JetBrains Mono&#x27;, &#x27;SF Mono&#x27;, Menlo, monospace" font-size="11.5" fill="#5b6878" font-weight="400" text-anchor="start">constants.ts DAY_TEMPLATE</text><text x="44" y="340" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">relaxed: act, lunch, act, act, dinner</text><text x="44" y="358" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">balanced: act, act, lunch, act,</text><text x="44" y="376" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">act, dinner</text><text x="44" y="394" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">packed: + one more act, + evening</text><rect x="390" y="100" width="330" height="110" rx="8" fill="#fff6d6" stroke="#b8860b" stroke-width="1.5"/><text x="402" y="124" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="14" fill="#8a6400" font-weight="700" text-anchor="start">For each slot</text><text x="402" y="142" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">skip lunch if already done/too late</text><text x="402" y="160" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">deadline = next meal earliest + 30</text><text x="402" y="178" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">(or 22:30 if no meal left)</text><path d="M 332 175 L 390 155" fill="none" stroke="#0d1b2a" stroke-width="1.6" marker-end="url(#a-navy)"/><path d="M 332 355 L 360 355 L 360 180 L 390 180" fill="none" stroke="#5b6878" stroke-width="1.6" marker-end="url(#a-muted)"/><rect x="380" y="240" width="860" height="420" rx="12" fill="none" stroke="#5b6878" stroke-width="1.2" stroke-dasharray="5 5"/><text x="394" y="262" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#5b6878" font-weight="700" text-anchor="start">BESTCANDIDATE(SLOT, DEADLINE)  ·  SCHEDULE.TS:194</text><rect x="400" y="278" width="250" height="120" rx="8" fill="#eaf1f8" stroke="#c9d1da" stroke-width="1.5"/><text x="412" y="302" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="14" fill="#0d1b2a" font-weight="700" text-anchor="start">1 · Pinned first</text><text x="412" y="320" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">must-sees / locked for this</text><text x="412" y="338" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">day in the current city:</text><text x="412" y="356" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">if any fits → take it, else →</text><rect x="670" y="278" width="270" height="120" rx="8" fill="#eaf1f8" stroke="#c9d1da" stroke-width="1.5"/><text x="682" y="302" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="14" fill="#0d1b2a" font-weight="700" text-anchor="start">2 · Candidate pool</text><text x="682" y="320" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">same city/town, not used,</text><text x="682" y="338" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">not reserved, site not used,</text><text x="682" y="356" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">eligible (budget, rating floor)</text><rect x="960" y="278" width="260" height="120" rx="8" fill="#ffffff" stroke="#c9d1da" stroke-width="1.5"/><text x="972" y="302" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="14" fill="#0d1b2a" font-weight="700" text-anchor="start">fitsSlot</text><text x="972" y="320" font-family="&#x27;JetBrains Mono&#x27;, &#x27;SF Mono&#x27;, Menlo, monospace" font-size="11.5" fill="#5b6878" font-weight="400" text-anchor="start">schedule.ts:52</text><text x="972" y="338" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">lunch/dinner: restaurant, or</text><text x="972" y="356" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">food café/market ≥ 45 min</text><text x="972" y="374" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">activity: anything but restaurants</text><path d="M 650 338 L 670 338" fill="none" stroke="#0d1b2a" stroke-width="1.6" marker-end="url(#a-navy)"/><path d="M 940 338 L 960 338" fill="none" stroke="#0d1b2a" stroke-width="1.6" marker-end="url(#a-navy)"/><rect x="400" y="420" width="400" height="220" rx="8" fill="#ffffff" stroke="#c9d1da" stroke-width="1.5"/><text x="412" y="444" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="14" fill="#0d1b2a" font-weight="700" text-anchor="start">evaluate(place) → start time or reject</text><text x="412" y="462" font-family="&#x27;JetBrains Mono&#x27;, &#x27;SF Mono&#x27;, Menlo, monospace" font-size="11.5" fill="#5b6878" font-weight="400" text-anchor="start">schedule.ts evaluate()</text><text x="412" y="480" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">start = cursor + travel (walk / bus estimate)</text><text x="412" y="498" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">meals: ≥ 12:30 / 19:30; or restaurant&#x27;s own opening</text><text x="412" y="516" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">evening-only: wait to 18:00 (≤ 60 min in activity)</text><text x="412" y="534" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">name window (&quot;at Dawn&quot;): move start into it</text><text x="412" y="552" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">end ≤ deadline (long visits ≥4 h: dinner + 30)</text><text x="412" y="570" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">fitsTime: season, 3rd weekend, open that day,</text><text x="412" y="588" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">restaurants by seating time, others whole visit</text><rect x="820" y="420" width="400" height="220" rx="8" fill="#f6f7f9" stroke="#c9d1da" stroke-width="1.5"/><text x="832" y="444" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="14" fill="#0d1b2a" font-weight="700" text-anchor="start">score and pick</text><text x="832" y="462" font-family="&#x27;JetBrains Mono&#x27;, &#x27;SF Mono&#x27;, Menlo, monospace" font-size="11.5" fill="#5b6878" font-weight="400" text-anchor="start">score.ts:56</text><text x="832" y="480" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">scorePlace(): priorities 5..1 → 0..1</text><text x="832" y="498" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">× 0.85 per same-type stop today (variety)</text><text x="832" y="516" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">highest wins; ties broken by place id</text><text x="832" y="534" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start"></text><text x="832" y="552" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">→ diagram 5 for the scoring formula</text><path d="M 785 398 L 785 410 L 600 410 L 600 420" fill="none" stroke="#0d1b2a" stroke-width="1.6" marker-end="url(#a-navy)"/><path d="M 800 530 L 820 530" fill="none" stroke="#0d1b2a" stroke-width="1.6" marker-end="url(#a-navy)"/><rect x="390" y="690" width="400" height="170" rx="8" fill="#e3f2ea" stroke="#2e7d5b" stroke-width="1.5"/><text x="402" y="714" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="14" fill="#2e7d5b" font-weight="700" text-anchor="start">place(candidate)</text><text x="402" y="732" font-family="&#x27;JetBrains Mono&#x27;, &#x27;SF Mono&#x27;, Menlo, monospace" font-size="11.5" fill="#5b6878" font-weight="400" text-anchor="start">schedule.ts place()</text><text x="402" y="750" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">push walk/bus Travel row (from previous stop)</text><text x="402" y="768" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">push Visit: start, end, slot, reasons, flags</text><text x="402" y="786" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">cursor = end · position = this place</text><text x="402" y="804" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">mark id + siteGroup used, remove from pending</text><text x="402" y="822" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">lunch done if lunch or visit ≥ 4 h</text><path d="M 1020 640 L 1020 670 L 590 670 L 590 690" fill="none" stroke="#2e7d5b" stroke-width="1.6" marker-end="url(#a-go)"/><rect x="776" y="651" width="49" height="18" rx="4" fill="#ffffff" opacity="0.92"/><text x="800" y="664" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#2e7d5b" font-weight="600" text-anchor="middle">winner</text><rect x="820" y="690" width="420" height="170" rx="8" fill="#fde7ea" stroke="#c8102e" stroke-width="1.5"/><text x="832" y="714" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="14" fill="#c8102e" font-weight="700" text-anchor="start">After the template</text><text x="832" y="732" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">day-trip town done → train back to hub</text><text x="832" y="750" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">leftover pinned → one more try later in the day</text><text x="832" y="768" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">(restaurant → dinner, evening tag → evening)</text><text x="832" y="786" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">still unplaced → returned → &#x27;day-overfull&#x27;</text><text x="832" y="804" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">conflict in plan()</text><path d="M 790 775 L 820 775" fill="none" stroke="#0d1b2a" stroke-width="1.6" marker-end="url(#a-navy)"/><path d="M 390 775 L 360 775 L 360 200 L 390 200" fill="none" stroke="#0d1b2a" stroke-width="1.6" marker-end="url(#a-navy)"/><rect x="326" y="507" width="68" height="18" rx="4" fill="#ffffff" opacity="0.92"/><text x="360" y="520" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#0d1b2a" font-weight="600" text-anchor="middle">next slot</text></svg>
