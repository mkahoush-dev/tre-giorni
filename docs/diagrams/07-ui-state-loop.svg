" font-size="13" fill="#1d2b3a" font-weight="400" text-anchor="start">step → board</text><text x="590" y="239" font-family="&#x27;JetBrains Mono&#x27;, &#x27;SF Mono&#x27;, Menlo, monospace" font-size="13" fill="#1d2b3a" font-weight="400" text-anchor="start">plan(input, route)</text><text x="48" y="279" font-family="&#x27;JetBrains Mono&#x27;, &#x27;SF Mono&#x27;, Menlo, monospace" font-size="13" fill="#0d1b2a" font-weight="700" text-anchor="start">swap</text><text x="330" y="279" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="13" fill="#1d2b3a" font-weight="400" text-anchor="start">changed = [new id]</text><text x="590" y="279" font-family="&#x27;JetBrains Mono&#x27;, &#x27;SF Mono&#x27;, Menlo, monospace" font-size="13" fill="#1d2b3a" font-weight="400" text-anchor="start">replaceVisit(…)  (alternatives from alternativesFor)</text><rect x="32" y="294" width="1216" height="40" fill="#f4f6f9"/><text x="48" y="319" font-family="&#x27;JetBrains Mono&#x27;, &#x27;SF Mono&#x27;, Menlo, monospace" font-size="13" fill="#0d1b2a" font-weight="700" text-anchor="start">remove</text><text x="330" y="319" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="13" fill="#1d2b3a" font-weight="400" text-anchor="start"></text><text x="590" y="319" font-family="&#x27;JetBrains Mono&#x27;, &#x27;SF Mono&#x27;, Menlo, monospace" font-size="13" fill="#1d2b3a" font-weight="400" text-anchor="start">removeVisit(…)  → relink travel rows</text><text x="48" y="359" font-family="&#x27;JetBrains Mono&#x27;, &#x27;SF Mono&#x27;, Menlo, monospace" font-size="13" fill="#0d1b2a" font-weight="700" text-anchor="start">toggle-lock</text><text x="330" y="359" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="13" fill="#1d2b3a" font-weight="400" text-anchor="start"></text><text x="590" y="359" font-family="&#x27;JetBrains Mono&#x27;, &#x27;SF Mono&#x27;, Menlo, monospace" font-size="1