4" rx="8" fill="#ffffff" stroke="#c9d1da" stroke-width="1.5"/><text x="44" y="536" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="14" fill="#0d1b2a" font-weight="700" text-anchor="start">Persistence</text><text x="44" y="554" font-family="&#x27;JetBrains Mono&#x27;, &#x27;SF Mono&#x27;, Menlo, monospace" font-size="11.5" fill="#5b6878" font-weight="400" text-anchor="start">state.ts:161-190</text><text x="44" y="572" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">useEffect → saveState(state)</text><text x="44" y="590" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">sessionStorage &#x27;tre-giorni:trip:v1&#x27;</text><text x="44" y="608" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">never contains the API key</text><rect x="440" y="512" width="380" height="104" rx="8" fill="#ffffff" stroke="#c9d1da" stroke-width="1.5"/><text x="452" y="536" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="14" fill="#0d1b2a" font-weight="700" text-anchor="start">Client-only rendering</text><text x="452" y="554" font-family="&#x27;JetBrains Mono&#x27;, &#x27;SF Mono&#x27;, Menlo, monospace" font-size="11.5" fill="#5b6878" font-weight="400" text-anchor="start">src/app/plan/TripLoader.tsx</text><text x="452" y="572" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">/plan loads TripApp with ssr: false</text><text x="452" y="590" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">(sessionStorage + Leaflet need window)</text><rect x="848" y="512" width="400" height="104" rx="8" fill="#e3f2ea" stroke="#2e7d5b" stroke-width="1.5"/><text x="860" y="536" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="14" fill="#2e7d5b" font-weight="700" text-anchor="start">Why this split matters</text><text x="860" y="554" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">planner is pure → 321 unit tests</text><text x="860" y="572" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">UI change can&#x27;t break a rule</text><text x="860" y="590" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">extend: add an action + a planner fn</text></svg>
