<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="t d"><title id="t">5 · How a place is scored</title><desc id="d">User priority order becomes weights 5 to 1; each place&#x27;s five signals scaled 0 to 1 are combined as a weighted average with small fixed adjustments; the top contributions become the explanation.</desc><defs><marker id="a-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0d1b2a"/></marker><marker id="a-go" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2e7d5b"/></marker><marker id="a-stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c8102e"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5b6878"/></marker><marker id="a-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b8860b"/></marker></defs><rect width="1280" height="640" fill="#ffffff"/><text x="32" y="44" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="22" fill="#0d1b2a" font-weight="700" text-anchor="start">5 · How a place is scored</text><text x="32" y="68" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="13.5" fill="#5b6878" font-weight="400" text-anchor="start">score.ts:56 — the user&#x27;s priority order becomes linear weights; every signal is scaled to 0..1 so the weights mean what they say.</text><rect x="32" y="100" width="300" height="230" rx="8" fill="#fff6d6" stroke="#b8860b" stroke-width="1.5"/><text x="44" y="124" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="14" fill="#8a6400" font-weight="700" text-anchor="start">User&#x27;s order (example)</text><text x="44" y="142" font-family="&#x27;JetBrains Mono&#x27;, &#x27;SF Mono&#x27;, Menlo, monospace" font-size="11.5" fill="#5b6878" font-weight="400" text-anchor="start">score.ts:51</text><text x="44" y="160" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">1. Hidden gems   × 5</text><text x="44" y="178" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">2. My interests  × 4</text><text x="44" y="196" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">3. Less walking  × 3</text><text x="44" y="214" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">4. Top rated     × 2</text><text x="44" y="232" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">5. Budget        × 1</text><text x="44" y="250" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start"></text><text x="44" y="268" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">weights(): n − position</text><rect x="380" y="100" width="420" height="330" rx="8" fill="#eaf1f8" stroke="#c9d1da" stroke-width="1.5"/><text x="392" y="124" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="14" fill="#0d1b2a" font-weight="700" text-anchor="start">signals(place) → 0..1</text><text x="392" y="142" font-family="&#x27;JetBrains Mono&#x27;, &#x27;SF Mono&#x27;, Menlo, monospace" font-size="11.5" fill="#5b6878" font-weight="400" text-anchor="start">score.ts:38 · constants.ts INTEREST_TAGS</text><text x="392" y="160" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">interests: matched interests (max 2) / 2</text><text x="392" y="178" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">     no interests picked → 0.5</text><text x="392" y="196" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">rating:  (rating − 3.5) / 1.5, clamped</text><text x="392" y="214" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">hidden:  0.5 + 0.5 if hidden-gem / local-</text><text x="392" y="232" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">     favourite / quiet − 0.5 if tourist-heavy</text><text x="392" y="250" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">budget:  (4 − price) / 3</text><text x="392" y="268" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">walking: 1 − min(minutes, 40) / 40</text><text x="392" y="286" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">     first stop of the day → 0.5</text><text x="392" y="304" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start"></text><text x="392" y="322" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">interest → tags: food = food, market ·</text><text x="392" y="340" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">history = historic, cultural · …</text><rect x="850" y="100" width="398" height="150" rx="8" fill="#ffffff" stroke="#c9d1da" stroke-width="1.5"/><text x="862" y="124" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="14" fill="#0d1b2a" font-weight="700" text-anchor="start">Weighted average</text><text x="862" y="142" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">total = Σ weight × signal / Σ weight</text><text x="862" y="160" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">→ always between 0 and 1</text><rect x="850" y="280" width="398" height="150" rx="8" fill="#f6f7f9" stroke="#c9d1da" stroke-width="1.5"/><text x="862" y="304" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="14" fill="#0d1b2a" font-weight="700" text-anchor="start">Small fixed adjustments</text><text x="862" y="322" font-family="&#x27;JetBrains Mono&#x27;, &#x27;SF Mono&#x27;, Menlo, monospace" font-size="11.5" fill="#5b6878" font-weight="400" text-anchor="start">constants.ts</text><text x="862" y="340" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">+0.05 morning tag before 12:00,</text><text x="862" y="358" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">    evening tag after 18:00</text><text x="862" y="376" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">× 0.9 hours assumed (uncertain)</text><text x="862" y="394" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">× 0.3 shown last time (Regenerate)</text><path d="M 332 215 L 380 215" fill="none" stroke="#0d1b2a" stroke-width="1.6" marker-end="url(#a-navy)"/><path d="M 800 175 L 850 175" fill="none" stroke="#0d1b2a" stroke-width="1.6" marker-end="url(#a-navy)"/><path d="M 1049 250 L 1049 280" fill="none" stroke="#0d1b2a" stroke-width="1.6" marker-end="url(#a-navy)"/><rect x="380" y="470" width="420" height="140" rx="8" fill="#f6f7f9" stroke="#c9d1da" stroke-width="1.5"/><text x="392" y="494" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="14" fill="#0d1b2a" font-weight="700" text-anchor="start">In buildDay only</text><text x="392" y="512" font-family="&#x27;JetBrains Mono&#x27;, &#x27;SF Mono&#x27;, Menlo, monospace" font-size="11.5" fill="#5b6878" font-weight="400" text-anchor="start">constants.ts VARIETY_FACTOR</text><text x="392" y="530" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">× 0.85 per same-type stop already today</text><text x="392" y="548" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">(three markets in a row lose to a museum)</text><rect x="850" y="470" width="398" height="140" rx="8" fill="#e3f2ea" stroke="#2e7d5b" stroke-width="1.5"/><text x="862" y="494" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="14" fill="#2e7d5b" font-weight="700" text-anchor="start">explain() → the &#x27;why&#x27; line</text><text x="862" y="512" font-family="&#x27;JetBrains Mono&#x27;, &#x27;SF Mono&#x27;, Menlo, monospace" font-size="11.5" fill="#5b6878" font-weight="400" text-anchor="start">score.ts:79</text><text x="862" y="530" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">top 2 parts with signal &gt; 0.5:</text><text x="862" y="548" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">&quot;Hidden gem · 6 min from Uffizi&quot;</text><text x="862" y="566" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">fallback &quot;Rated 4.6&quot;; must-see/locked first</text><path d="M 1049 430 L 1049 470" fill="none" stroke="#2e7d5b" stroke-width="1.6" marker-end="url(#a-go)"/><path d="M 590 430 L 590 470" fill="none" stroke="#5b6878" stroke-width="1.6" marker-end="url(#a-muted)"/><rect x="32" y="360" width="300" height="256" rx="8" fill="#ffffff" stroke="#0d1b2a" stroke-width="1.5"/><text x="44" y="384" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="14" fill="#0d1b2a" font-weight="700" text-anchor="start">Worked example</text><text x="44" y="402" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">Aventine Keyhole, first stop,</text><text x="44" y="420" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">user picked Food + Art</text><text x="44" y="438" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">hidden 1.0 × 5 = 5.0</text><text x="44" y="456" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">interests 0 × 4 = 0 (no match)</text><text x="44" y="474" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">walking 0.5 × 3 = 1.5</text><text x="44" y="492" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">rating 0.73 × 2 = 1.47</text><text x="44" y="510" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">budget 1.0 × 1 = 1.0</text><text x="44" y="528" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">total = 8.97 / 15 = 0.60</text><text x="44" y="546" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">hours assumed × 0.9 = 0.54</text></svg>
