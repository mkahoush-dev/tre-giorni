<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" role="img" aria-labelledby="t d"><title id="t">6 · The one LLM step, and where the API key goes</title><desc id="d">Sequence diagram: user enters key and text, key stored in memory, interpretWishes calls the provider adapter, which calls the provider directly over HTTPS; the untrusted JSON is validated before the reducer applies it.</desc><defs><marker id="a-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0d1b2a"/></marker><marker id="a-go" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2e7d5b"/></marker><marker id="a-stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c8102e"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5b6878"/></marker><marker id="a-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b8860b"/></marker></defs><rect width="1280" height="860" fill="#ffffff"/><text x="32" y="44" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="22" fill="#0d1b2a" font-weight="700" text-anchor="start">6 · The one LLM step, and where the API key goes</text><text x="32" y="68" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="13.5" fill="#5b6878" font-weight="400" text-anchor="start">Free text → structured preferences. The key travels browser → provider only; output is untrusted until validateWishes accepts it.</text><rect x="2" y="92" width="176" height="40" rx="8" fill="#0d1b2a"/><text x="90" y="117" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">User</text><line x1="90" y1="132" x2="90" y2="830" stroke="#c9d1da" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="212" y="92" width="176" height="40" rx="8" fill="#0d1b2a"/><text x="300" y="117" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">AiBox + aiKey</text><line x1="300" y1="132" x2="300" y2="830" stroke="#c9d1da" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="432" y="92" width="176" height="40" rx="8" fill="#0d1b2a"/><text x="520" y="117" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">interpretWishes</text><line x1="520" y1="132" x2="520" y2="830" stroke="#c9d1da" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="672" y="92" width="176" height="40" rx="8" fill="#0d1b2a"/><text x="760" y="117" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">Provider adapter (SDK)</text><line x1="760" y1="132" x2="760" y2="830" stroke="#c9d1da" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="922" y="92" width="176" height="40" rx="8" fill="#0d1b2a"/><text x="1010" y="117" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">LLM provider</text><line x1="1010" y1="132" x2="1010" y2="830" stroke="#c9d1da" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="1102" y="92" width="176" height="40" rx="8" fill="#0d1b2a"/><text x="1190" y="117" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">Reducer / form</text><line x1="1190" y1="132" x2="1190" y2="830" stroke="#c9d1da" stroke-width="1.5" stroke-dasharray="4 4"/><path d="M 90 170 L 292 170" fill="none" stroke="#0d1b2a" stroke-width="1.6" marker-end="url(#a-navy)"/><rect x="48" y="149" width="293" height="18" rx="4" fill="#ffffff" opacity="0.92"/><text x="195.0" y="162" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#0d1b2a" font-weight="600" text-anchor="middle">pastes key, picks provider/model, types text</text><rect x="196" y="190" width="208" height="92" rx="8" fill="#e3f2ea" stroke="#2e7d5b" stroke-width="1.5"/><text x="208" y="214" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="14" fill="#2e7d5b" font-weight="700" text-anchor="start">setKey(key, remember)</text><text x="208" y="232" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">memory only, or</text><text x="208" y="250" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">sessionStorage if</text><text x="208" y="268" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">&quot;Remember for this tab&quot;</text><path d="M 300 310 L 512 310" fill="none" stroke="#0d1b2a" stroke-width="1.6" marker-end="url(#a-navy)"/><rect x="267" y="289" width="287" height="18" rx="4" fill="#ffffff" opacity="0.92"/><text x="410.0" y="302" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#0d1b2a" font-weight="600" text-anchor="middle">interpretWishes(provider, key, model, text)</text><rect x="432" y="330" width="176" height="70" rx="8" fill="#f6f7f9" stroke="#c9d1da" stroke-width="1.5"/><text x="444" y="354" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="14" fill="#0d1b2a" font-weight="700" text-anchor="start">trim to 1500 chars</text><text x="444" y="372" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">empty → error, no call</text><path d="M 520 430 L 752 430" fill="none" stroke="#0d1b2a" stroke-width="1.6" marker-end="url(#a-navy)"/><rect x="587" y="409" width="107" height="18" rx="4" fill="#ffffff" opacity="0.92"/><text x="640.0" y="422" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#0d1b2a" font-weight="600" text-anchor="middle">callProvider(…)</text><rect x="652" y="450" width="216" height="144" rx="8" fill="#eaf1f8" stroke="#c9d1da" stroke-width="1.5"/><text x="664" y="474" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="14" fill="#0d1b2a" font-weight="700" text-anchor="start">build request</text><text x="664" y="492" font-family="&#x27;JetBrains Mono&#x27;, &#x27;SF Mono&#x27;, Menlo, monospace" font-size="11.5" fill="#5b6878" font-weight="400" text-anchor="start">schema.ts:82</text><text x="664" y="510" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">system = rules + catalog</text><text x="664" y="528" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">(id | name | city | type |</text><text x="664" y="546" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">tags; excluded places</text><text x="664" y="564" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">left out)</text><text x="664" y="582" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">schema = WishesSchema</text><path d="M 760 610 L 1002 610" fill="none" stroke="#2e7d5b" stroke-width="1.6" marker-end="url(#a-go)"/><rect x="783" y="589" width="203" height="18" rx="4" fill="#ffffff" opacity="0.92"/><text x="885.0" y="602" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#2e7d5b" font-weight="600" text-anchor="middle">HTTPS, key in auth header only</text><rect x="902" y="630" width="216" height="92" rx="8" fill="#f3eefc" stroke="#7b5ea7" stroke-width="1.5"/><text x="914" y="654" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="14" fill="#5a3d8a" font-weight="700" text-anchor="start">structured output</text><text x="914" y="672" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">Anthropic: output_config</text><text x="914" y="690" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">OpenAI: text.format strict</text><text x="914" y="708" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">Gemini: response_format</text><path d="M 1010 745 L 768 745" fill="none" stroke="#c8102e" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#a-stop)"/><rect x="828" y="724" width="113" height="18" rx="4" fill="#ffffff" opacity="0.92"/><text x="885.0" y="737" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#c8102e" font-weight="600" text-anchor="middle">JSON (untrusted)</text><path d="M 760 775 L 528 775" fill="none" stroke="#c8102e" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#a-stop)"/><rect x="426" y="754" width="429" height="18" rx="4" fill="#ffffff" opacity="0.92"/><text x="640.0" y="767" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#c8102e" font-weight="600" text-anchor="middle">raw object · or AiError (auth / rate-limit / refused / truncated)</text><rect x="432" y="790" width="300" height="56" rx="8" fill="#e3f2ea" stroke="#2e7d5b" stroke-width="1.5"/><text x="444" y="814" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="14" fill="#2e7d5b" font-weight="700" text-anchor="start">validateWishes()  ·  schema.ts:51</text><path d="M 732 818 L 1182 818" fill="none" stroke="#2e7d5b" stroke-width="1.6" marker-end="url(#a-go)"/><rect x="826" y="797" width="268" height="18" rx="4" fill="#ffffff" opacity="0.92"/><text x="960" y="810" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#2e7d5b" font-weight="600" text-anchor="middle">apply-wishes: fills form, adds must-sees</text><rect x="1060" y="150" width="210" height="200" rx="12" fill="none" stroke="#2e7d5b" stroke-width="1.2" stroke-dasharray="5 5"/><text x="1074" y="172" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#2e7d5b" font-weight="700" text-anchor="start">CSP · NEXT.CONFIG.TS</text><text x="1072" y="196" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">connect-src allows only:</text><text x="1072" y="218" font-family="&#x27;JetBrains Mono&#x27;, &#x27;SF Mono&#x27;, Menlo, monospace" font-size="12" fill="#2e7d5b" font-weight="600" text-anchor="start">&#x27;self&#x27;</text><text x="1072" y="238" font-family="&#x27;JetBrains Mono&#x27;, &#x27;SF Mono&#x27;, Menlo, monospace" font-size="12" fill="#2e7d5b" font-weight="600" text-anchor="start">api.anthropic.com</text><text x="1072" y="258" font-family="&#x27;JetBrains Mono&#x27;, &#x27;SF Mono&#x27;, Menlo, monospace" font-size="12" fill="#2e7d5b" font-weight="600" text-anchor="start">api.openai.com</text><text x="1072" y="278" font-family="&#x27;JetBrains Mono&#x27;, &#x27;SF Mono&#x27;, Menlo, monospace" font-size="12" fill="#2e7d5b" font-weight="600" text-anchor="start">generativelanguage</text><text x="1072" y="298" font-family="&#x27;JetBrains Mono&#x27;, &#x27;SF Mono&#x27;, Menlo, monospace" font-size="12" fill="#2e7d5b" font-weight="600" text-anchor="start">.googleapis.com</text><text x="1072" y="330" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12" fill="#c8102e" font-weight="700" text-anchor="start">fetch elsewhere → blocked</text></svg>
