nter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">a day after a range starts</text><text x="44" y="450" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">a new group</text><text x="44" y="468" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">close ≤ open → +24 h</text><text x="44" y="486" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">unknown text → null</text></svg>
