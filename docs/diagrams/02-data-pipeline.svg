 -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">true / false /</text><text x="312" y="336" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">null → &quot;unknown&quot;</text><rect x="536" y="258" width="220" height="138" rx="8" fill="#eaf1f8" stroke="#c9d1da" stroke-width="1.5"/><text x="548" y="282" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="14" fill="#0d1b2a" font-weight="700" text-anchor="start">startWindow</text><text x="548" y="300" font-family="&#x27;JetBrains Mono&#x27;, &#x27;SF Mono&#x27;, Menlo, monospace" font-size="11.5" fill="#5b6878" font-weight="400" text-anchor="start">normalize.ts:71</text><text x="548" y="318" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">&quot;at Dawn&quot; → 06–10</text><text x="548" y="336" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">&quot;by Night&quot; → 20–23</text><rect x="772" y="258" width="220" height="138" rx="8" fill="#eaf1f8" stroke="#c9d1da" stroke-width="1.5"/><text x="784" y="282" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="14" fill="#0d1b2a" font-weight="700" text-anchor="start">normalizeTags</text><text x="784" y="300" font-family="&#x27;JetBrains Mono&#x27;, &#x27;SF Mono&#x27;, Menlo, monospace" font-size="11.5" fill="#5b6878" font-weight="400" text-anchor="start">normalize.ts:80</text><text x="784" y="318" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d2b3a" font-weight="400" text-anchor="start">lowercase, _ → -</text><text x="784" y="336" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, 